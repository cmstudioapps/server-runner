<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ServerRunner</title>
  <style>
    :root {
      --bg: #090b0d;
      --fg: #f6f7f9;
      --muted: rgba(255, 255, 255, 0.65);
      --cyan: #5ef2ff;
      --pink: #ff86b5;
      --shadow: rgba(94, 242, 255, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    .splash {
      position: relative;
      width: 520px;
      height: 340px;
      border-radius: 28px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 20%, rgba(94, 242, 255, 0.22), transparent 35%),
        radial-gradient(circle at 20% 80%, rgba(255, 134, 181, 0.16), transparent 28%),
        linear-gradient(180deg, rgba(18, 20, 24, 0.96), rgba(9, 11, 13, 0.96));
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow:
        0 20px 80px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(94, 242, 255, 0.08) inset;
      animation: popIn 520ms cubic-bezier(.16,1,.3,1);
    }

    .splash::before {
      content: "";
      position: absolute;
      inset: -40%;
      background:
        radial-gradient(circle at 25% 30%, rgba(94, 242, 255, 0.18), transparent 20%),
        radial-gradient(circle at 75% 70%, rgba(255, 134, 181, 0.12), transparent 22%);
      filter: blur(20px);
      opacity: 0.9;
      animation: drift 7s ease-in-out infinite alternate;
    }

    .splash::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(transparent 0 96%, rgba(255,255,255,0.04) 96% 100%),
        linear-gradient(90deg, transparent 0 96%, rgba(255,255,255,0.03) 96% 100%);
      background-size: 100% 4px, 4px 100%;
      opacity: 0.18;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 32px;
      text-align: center;
    }

    .logo-wrap {
      width: 120px;
      height: 120px;
      border-radius: 28px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 30px rgba(94, 242, 255, 0.12);
      animation: breathe 2.8s ease-in-out infinite;
    }

    .logo-wrap img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      filter: drop-shadow(0 0 18px rgba(94, 242, 255, 0.35));
    }

    .brand {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -1.2px;
      color: var(--fg);
      line-height: 1;
    }

    .brand span {
      color: var(--pink);
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      max-width: 340px;
    }

    .loading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .dots {
      display: inline-flex;
      gap: 5px;
    }

    .dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--shadow);
      animation: dotPulse 1.2s infinite ease-in-out;
    }

    .dots span:nth-child(2) { animation-delay: 0.15s; }
    .dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.9) translateY(12px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes breathe {
      0%, 100% { transform: translateY(0) scale(1); box-shadow: 0 0 30px rgba(94, 242, 255, 0.12); }
      50% { transform: translateY(-2px) scale(1.02); box-shadow: 0 0 36px rgba(94, 242, 255, 0.2); }
    }

    @keyframes drift {
      from { transform: translate3d(-2%, -1%, 0) scale(1); }
      to { transform: translate3d(2%, 1%, 0) scale(1.04); }
    }

    @keyframes dotPulse {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.45; }
      40% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="content">
      <div class="logo-wrap">
        <img src="assets/logo.png" alt="ServerRunner" />
      </div>
      <div class="brand">Server<span>Runner</span></div>
      <div class="subtitle">Carregando a interface, temas e monitoramento.</div>
      <div class="loading">
        <span class="dots"><span></span><span></span><span></span></span>
        <span>Inicializando</span>
      </div>
    </div>
  </div>
</body>
</html>
