<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arquivos - ServerRunner</title>
  <link rel="stylesheet" href="css/files.css" />
  <!-- Editor modular: modelo, highlight, view -->
  <script src="js/editor/EditorModel.js"></script>
  <script src="js/editor/SyntaxHighlighter.js"></script>
  <script src="js/editor/EditorView.js"></script>
</head>
<body>
  <!-- Background media layer (imagem/vídeo) -->
  <div class="files-media-layer" id="files-media-layer" style="display:none">
    <img id="files-bg-image-el" style="display:none" alt="" />
    <video id="files-bg-video-el" style="display:none" muted loop playsinline autoplay></video>
  </div>

  <!-- Titlebar -->
  <div class="files-titlebar" id="files-titlebar">
    <div class="files-titlebar-drag">
      <span class="files-title" id="files-title">Carregando...</span>
    </div>
    <div class="files-titlebar-actions">
      <button class="files-tb-btn" id="files-minimize" title="Recuar">
        <svg width="12" height="12" viewBox="0 0 12 12"><rect y="5" width="12" height="2" fill="currentColor"/></svg>
      </button>
      <button class="files-tb-btn files-tb-close" id="files-close" title="Fechar">
        <svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
  </div>

  <div class="files-container">
    <!-- Sidebar com árvore de arquivos -->
    <aside class="files-sidebar" id="files-sidebar">
      <div class="files-sidebar-header">
        <span class="files-sidebar-title">Explorador</span>
        <button class="files-refresh-btn" id="files-refresh" title="Atualizar árvore">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M1 7a6 6 0 0111-4M13 7a6 6 0 01-11 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            <path d="M12 1v4H8M2 13V9h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <div class="files-tree" id="files-tree">
        <div class="files-tree-loading">Carregando...</div>
      </div>
    </aside>

    <!-- Painel principal: editor -->
    <main class="files-main" id="files-main">
      <!-- Estado vazio -->
      <div class="files-empty" id="files-empty">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
          <path d="M28 6H12a2 2 0 00-2 2v32a2 2 0 002 2h24a2 2 0 002-2V16l-10-10z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" opacity="0.3"/>
          <path d="M28 6v10h10" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" opacity="0.3"/>
        </svg>
        <p>Selecione um arquivo na árvore ao lado</p>
      </div>

      <!-- Editor (inicialmente oculto) -->
      <div class="files-editor" id="files-editor" style="display:none">
        <div class="files-editor-header">
          <span class="files-editor-filename" id="files-editor-filename"></span>
          <span class="files-editor-status" id="files-editor-status"></span>
        </div>
        <div class="files-editor-body" id="files-editor-body">
          <div class="files-code-wrapper">
            <pre class="files-code-pre" id="files-code-pre"><code class="files-code" id="files-code" contenteditable="true" spellcheck="false"></code></pre>
          </div>
        </div>
        <div class="files-editor-footer">
          <span class="files-editor-info" id="files-editor-info"></span>
        </div>
      </div>
    </main>
  </div>

  <script>
    // ===================================================================
    // ServerRunner — Editor de Código Modular
    // ===================================================================
    // ARQUITETURA DE 3 CAMADAS:
    //
    //   EditorModel      → Texto puro (fonte da verdade)
    //   SyntaxHighlighter→ Texto → HTML com spans
    //   EditorView       → Renderiza HTML e captura input
    //
    // REGRA DE OURO:
    //   - O arquivo permanece 100% texto puro
    //   - A coloração existe APENAS na renderização
    //   - HTML nunca aparece para o usuário
    //   - HTML nunca é salvo no arquivo
    //   - Renderização é separada da lógica de edição
    // ===================================================================

    'use strict';

    // =================== INICIALIZAÇÃO ===================
    const params = new URLSearchParams(window.location.search);
    const serverId = params.get('serverId');
    const serverName = params.get('name') || 'Arquivos';
    document.getElementById('files-title').textContent = serverName + ' — Arquivos';

    // =================== REFERÊNCIAS DOM ===================
    const treeEl = document.getElementById('files-tree');
    const emptyEl = document.getElementById('files-empty');
    const editorEl = document.getElementById('files-editor');
    const filenameEl = document.getElementById('files-editor-filename');
    const statusEl = document.getElementById('files-editor-status');
    const codeEl = document.getElementById('files-code');
    const preEl = document.getElementById('files-code-pre');
    const infoEl = document.getElementById('files-editor-info');
    const refreshBtn = document.getElementById('files-refresh');

    let currentFilePath = null;
    let fileTree = null;
    let saveTimeout = null;

    // =================== MODELO (EditorModel) ===================
    // Fonte única da verdade: texto puro, sem HTML
    const editorModel = new EditorModel();

    // =================== VIEW (EditorView) ===================
    // Inicializa a view conectando ao modelo e ao DOM
    EditorView.init(codeEl, editorModel, {
      onChange: (text) => {
        // Toda vez que o texto muda no modelo
        if (!currentFilePath) return;

        statusEl.textContent = '✎ Editando...';
        statusEl.className = 'files-editor-status editing';
        updateLineNumbers();

        // Agenda auto-save
        if (saveTimeout) clearTimeout(saveTimeout);
        saveTimeout = setTimeout(saveFile, 1500);
      },
      onSave: () => {
        // Ctrl+S pressionado
        performSave();
      },
    });

    // =================== PREFERÊNCIAS DO EDITOR ===================
    function lp(key, def) {
      const sv = localStorage.getItem(`pref:editor-${serverId}-${key}`);
      if (sv !== null) return sv;
      const gv = localStorage.getItem(`pref:editor-${key}`);
      if (gv !== null) return gv;
      return def;
    }

    function lpn(key, def) {
      const v = lp(key, def);
      const n = parseFloat(v);
      return isNaN(n) ? def : n;
    }

    function applyEditorPrefs() {
      const root = document.documentElement;
      const editorBody = document.getElementById('files-editor-body');

      root.style.setProperty('--editor-font-family', lp('font', "'JetBrains Mono', monospace"));
      root.style.setProperty('--editor-font-size', lpn('font-size', 14) + 'px');
      root.style.setProperty('--editor-line-height', lpn('line-height', 1.6));

      const theme = lp('theme', 'dark');
      const themeClasses = ['theme-dark', 'theme-light', 'theme-sepia', 'theme-contrast'];
      if (editorBody) {
        editorBody.classList.remove(...themeClasses);
        editorBody.classList.add('theme-' + theme);
      }

      const palettes = {
        dark: {
          bg: '#121418', text: '#E4E7EB', gutter: '#2A2D35',
          lineNum: '#6B7280', cursor: '#5EF2FF',
          selection: 'rgba(94, 242, 255, 0.15)', currentLine: 'rgba(255,255,255,0.03)',
        },
        light: {
          bg: '#FAFBFC', text: '#24292E', gutter: '#E8ECF0',
          lineNum: '#959DA5', cursor: '#0366D6',
          selection: 'rgba(3, 102, 214, 0.15)', currentLine: 'rgba(0,0,0,0.02)',
        },
        sepia: {
          bg: '#FBF3E8', text: '#433F3A', gutter: '#E8DFD3',
          lineNum: '#9C9286', cursor: '#C9511D',
          selection: 'rgba(201, 81, 29, 0.15)', currentLine: 'rgba(0,0,0,0.02)',
        },
        contrast: {
          bg: '#000000', text: '#FFFFFF', gutter: '#1A1A1A',
          lineNum: '#555555', cursor: '#FFFFFF',
          selection: 'rgba(255,255,255,0.12)', currentLine: 'rgba(255,255,255,0.04)',
        },
      };

      const p = palettes[theme] || palettes.dark;
      Object.entries(p).forEach(([key, val]) => {
        root.style.setProperty('--editor-' + key.replace(/([A-Z])/g, '-$1').toLowerCase(), val);
      });

      const wrap = lp('word-wrap', 'on');
      if (preEl) {
        preEl.style.whiteSpace = wrap === 'on' ? 'pre-wrap' : 'pre';
        preEl.style.wordBreak = wrap === 'on' ? 'break-word' : 'normal';
      }
    }

    applyEditorPrefs();

    // =================== OUVE MUDANÇAS NAS SETTINGS ===================
    function syncBgMedia() {
      const mirror = localStorage.getItem('pref:bgMirrorFiles') === 'true';
      const type = localStorage.getItem('pref:bgMediaType');
      const path = localStorage.getItem('pref:bgMediaPath');

      const layer = document.getElementById('files-media-layer');
      const img = document.getElementById('files-bg-image-el');
      const vid = document.getElementById('files-bg-video-el');

      if (!layer || !img || !vid) return;

      if (!mirror || !type || !path) {
        layer.style.display = 'none';
        img.src = '';
        vid.src = '';
        vid.style.display = 'none';
        document.body.classList.remove('has-bg-media');
        return;
      }

      document.body.classList.add('has-bg-media');
      
      const opacity = parseFloat(localStorage.getItem('pref:appBgOpacity')) || 0.3;
      const brightness = parseFloat(localStorage.getItem('pref:appBgBrightness')) || 0.5;
      layer.style.setProperty('--bg-media-opacity', opacity);
      layer.style.setProperty('--bg-media-brightness', brightness);

      layer.style.display = 'block';
      img.style.display = 'none';
      vid.style.display = 'none';

      if (type === 'image') {
        img.src = path;
        img.style.display = 'block';
      } else {
        vid.src = path;
        vid.style.display = 'block';
        vid.play().catch(() => {});
      }
    }

    window.addEventListener('storage', (event) => {
      if (!event.key) return;
      if (event.key.startsWith('pref:editor-')) {
        applyEditorPrefs();
        // Re-render se tiver arquivo aberto
        if (currentFilePath && editorModel.text) {
          EditorView.refresh();
        }
      }
      if (
        event.key === 'pref:bgMediaType' ||
        event.key === 'pref:bgMediaPath' ||
        event.key === 'pref:bgMirrorFiles' ||
        event.key === 'pref:appBgOpacity' ||
        event.key === 'pref:appBgBrightness'
      ) {
        syncBgMedia();
      }
    });

    syncBgMedia();

    // =================== ÁRVORE DE ARQUIVOS (LAZY LOADING) ===================
    // Só carrega o conteúdo de arquivos quando clicar.
    // Pastas carregam os filhos sob demanda (ao expandir).

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str || '';
      return d.innerHTML;
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1048576).toFixed(1) + ' MB';
    }

    function getFileIcon(name) {
      const ext = (name || '').split('.').pop().toLowerCase();
      const isDir = arguments.length > 1 && arguments[1] === true;

      if (isDir) return 'folder';

      // Mapa de extensão → tipo de ícone
      const typeMap = {
        js: 'javascript', mjs: 'javascript', cjs: 'javascript',
        ts: 'typescript', mts: 'typescript', cts: 'typescript',
        jsx: 'react', tsx: 'react',
        html: 'html', htm: 'html',
        css: 'css', scss: 'css', less: 'css', sass: 'css',
        json: 'json',
        md: 'markdown', mdx: 'markdown',
        xml: 'xml', svg: 'svg',
        py: 'python',
        rb: 'ruby',
        php: 'php',
        java: 'java', class: 'java', jar: 'java',
        c: 'c', cpp: 'cpp', h: 'c-header', hpp: 'c-header',
        cs: 'csharp',
        go: 'go',
        rs: 'rust',
        swift: 'swift',
        kt: 'kotlin', kts: 'kotlin',
        sh: 'shell', bash: 'shell', zsh: 'shell',
        yaml: 'yaml', yml: 'yaml',
        sql: 'sql',
        graphql: 'graphql', gql: 'graphql',
        vue: 'vue',
        svelte: 'svelte',
        astro: 'astro',
        txt: 'text',
        env: 'env',
        gitignore: 'git', gitkeep: 'git', gitattributes: 'git', gitmodules: 'git',
        png: 'image', jpg: 'image', jpeg: 'image', gif: 'image', webp: 'image', bmp: 'image', ico: 'image',
        pdf: 'pdf',
        zip: 'archive', tar: 'archive', gz: 'archive', rar: 'archive', '7z': 'archive',
        mp4: 'video', webm: 'video', avi: 'video', mov: 'video', mkv: 'video',
        mp3: 'audio', wav: 'audio', ogg: 'audio', flac: 'audio',
        exe: 'binary', deb: 'binary', rpm: 'binary', dmg: 'binary',
        lock: 'lock',
        toml: 'config', cfg: 'config', ini: 'config', conf: 'config',
        makefile: 'make', dockerfile: 'docker',
        vuepress: 'vue',
        wasm: 'wasm',
      };

      return typeMap[ext] || 'file';
    }

    function fileIconSVG(type) {
      // SVGs baseados no tipo (ícones mais bonitos que emoji)
      const icons = {
        folder: `<svg class="tree-icon fi" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M1.5 3.5v9a1 1 0 001 1h11a1 1 0 001-1V6a1 1 0 00-1-1H8L6.5 3.5h-4a1 1 0 00-1 1z" fill="#5EF2FF" fill-opacity="0.2" stroke="#5EF2FF" stroke-width="1.2"/></svg>`,
        'folder-open': `<svg class="tree-icon fi" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M1.5 4.5v8a1 1 0 001 1h11a1 1 0 001-1V6a1 1 0 00-1-1H8L6.5 3.5h-4a1 1 0 00-1 1z" fill="#5EF2FF" fill-opacity="0.3" stroke="#5EF2FF" stroke-width="1.2"/><path d="M2 5.5l1-2h2l1.5 2H14" stroke="#5EF2FF" stroke-width="1" opacity="0.5"/></svg>`,
        javascript: `<svg class="tree-icon fi js" width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="2" fill="#F7DF1E" fill-opacity="0.15" stroke="#F7DF1E" stroke-width="1.2"/><text x="8" y="12" text-anchor="middle" font-size="9" font-weight="bold" fill="#F7DF1E">JS</text></svg>`,

        archive: `<svg class="tree-icon fi zip" width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="2" fill="#FFBD2E" fill-opacity="0.15" stroke="#FFBD2E" stroke-width="1.2"/><text x="8" y="12" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFBD2E">Z</text></svg>`,

      return icons[type] || icons.file;
    }

    function renderTreeItem(node, depth) {
      if (!node) return '';
      const indent = depth * 16;
      const isDir = node.type === 'directory';
      const chevron = isDir ? `<span class="tree-chevron">▶</span>` : '';
      const iconType = isDir ? 'folder' : getFileIcon(node.name);
      const icon = `<span class="tree-icon-wrap">${fileIconSVG(iconType)}</span>`;
      const sizeStr = node.size ? `<span class="tree-size">${formatSize(node.size)}</span>` : '';

      return `<div class="tree-item ${isDir ? 'tree-dir' : 'tree-file'}" data-path="${escapeHtml(node.path)}" data-type="${isDir ? 'dir' : 'file'}" style="padding-left:${indent + 8}px" data-loaded="false">
        ${chevron}${icon}<span class="tree-label">${escapeHtml(node.name)}</span>${sizeStr}
      </div>`;
    }

    function updateTreeActive(path) {
      treeEl.querySelectorAll('.tree-item').forEach(el => {
        el.classList.toggle('tree-active', el.dataset.path === path);
      });
    }

    async function refreshTree() {
      treeEl.innerHTML = '<div class="files-tree-loading">Carregando...</div>';
      try {
        const result = await window.api.listFiles(serverId);
        fileTree = result.tree;
        const children = fileTree.children || [];

        treeEl.innerHTML = children.map(child => renderTreeItem(child, 0)).join('');
        attachTreeEvents();
        updateTreeActive(currentFilePath);
      } catch (err) {
        treeEl.innerHTML = `<div class="files-tree-error">Erro: ${escapeHtml(err.message)}</div>`;
      }
    }

    async function loadDirChildren(dirPath) {
      try {
        const children = await window.api.listDir(serverId, dirPath);
        return children;
      } catch (err) {
        console.error('Erro ao listar diretório:', err);
        return [];
      }
    }

    async function loadFile(filePath) {
      if (!filePath) return;
      if (saveTimeout) {
        clearTimeout(saveTimeout);
        saveTimeout = null;
      }

      statusEl.textContent = 'Abrindo...';
      statusEl.className = 'files-editor-status';

      try {
        const result = await window.api.readFile(serverId, filePath);
        currentFilePath = filePath;
        editorModel.load(result.path, result.name, result.content, result);
        filenameEl.textContent = result.path;
        emptyEl.style.display = 'none';
        editorEl.style.display = 'flex';
        EditorView.refresh();
        EditorView.focus();
        updateLineNumbers();
        updateFileInfo(result);
        statusEl.textContent = 'Salvo';
        statusEl.className = 'files-editor-status saved';
      } catch (err) {
        statusEl.textContent = 'Erro';
        statusEl.className = 'files-editor-status error';
        infoEl.textContent = err.message || 'Não foi possível abrir o arquivo.';
      }
    }

    function updateFileInfo(info = editorModel.fileInfo) {
      const lines = (editorModel.text.match(/\n/g) || []).length + 1;
      const size = info?.size !== undefined ? formatSize(info.size) : formatSize(new Blob([editorModel.text]).size);
      infoEl.textContent = `${lines} linha${lines === 1 ? '' : 's'} • ${size}`;
    }

    function updateLineNumbers() {
      updateFileInfo();
    }

    function saveFile() {
      performSave();
    }

    async function performSave() {
      if (!currentFilePath) return;
      if (saveTimeout) {
        clearTimeout(saveTimeout);
        saveTimeout = null;
      }

      statusEl.textContent = 'Salvando...';
      statusEl.className = 'files-editor-status editing';

      try {
        // ⚡ CORREÇÃO: usa editorModel.text diretamente (texto puro, sem HTML)
        const result = await window.api.writeFile(serverId, currentFilePath, editorModel.text);
        editorModel.markSaved();
        editorModel._fileInfo = result;
        updateFileInfo(result);
        statusEl.textContent = 'Salvo';
        statusEl.className = 'files-editor-status saved';
      } catch (err) {
        statusEl.textContent = 'Erro ao salvar';
        statusEl.className = 'files-editor-status error';
        infoEl.textContent = err.message || 'Não foi possível salvar o arquivo.';
      }
    }

    function attachTreeEvents() {
      treeEl.onclick = async (e) => {
        const el = e.target.closest('.tree-item');
        if (!el) return;
        e.stopPropagation();

        const itemPath = el.dataset.path;
        if (el.dataset.type === 'file') {
          updateTreeActive(itemPath);
          loadFile(itemPath);
          return;
        }

        const chevron = el.querySelector('.tree-chevron');
        const expanded = chevron?.classList.contains('expanded');
        let container = el.nextElementSibling;

        if (expanded) {
          chevron?.classList.remove('expanded');
          el.classList.remove('expanded');
          if (container && container.classList.contains('tree-children')) container.style.display = 'none';
          return;
        }

        chevron?.classList.add('expanded');
        el.classList.add('expanded');

        if (container && container.classList.contains('tree-children') && container.dataset.loaded === 'true') {
          container.style.display = 'block';
          return;
        }

        if (!container || !container.classList.contains('tree-children')) {
          container = document.createElement('div');
          container.className = 'tree-children';
          el.parentNode.insertBefore(container, el.nextSibling);
        }

        container.innerHTML = '<div class="files-tree-loading" style="padding:8px 16px;font-size:12px;">Carregando...</div>';
        container.style.display = 'block';

        const children = await loadDirChildren(itemPath);
        const depth = Math.floor((parseInt(el.style.paddingLeft, 10) || 8) / 16) + 1;
        container.innerHTML = children.map(child => renderTreeItem(child, depth)).join('');
        container.dataset.loaded = 'true';
      };
    }

    // =================== CONTROLES DA JANELA ===================
    document.getElementById('files-close').addEventListener('click', () => window.api.closeFileWindow());
    document.getElementById('files-minimize').addEventListener('click', () => {
      window.api.minimizeFileWindow();
    });

    // Refresh
    refreshBtn.addEventListener('click', refreshTree);

    // =================== INICIALIZAÇÃO ===================
    refreshTree();
  </script>
</body>
</html>
