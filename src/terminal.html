<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terminal - ServerRunner</title>
  <link rel="stylesheet" href="css/terminal.css" />
</head>
<body>
  <div class="term-media-layer" id="term-media-layer" style="display:none">
    <img id="term-bg-image-el" style="display:none" alt="" />
    <video id="term-bg-video-el" style="display:none" muted loop playsinline autoplay></video>
  </div>
  <div class="term-container" id="term-container">
    <div class="term-titlebar" id="term-titlebar">
      <div class="term-dots">
        <span class="dot dot-red" id="term-close" title="Fechar"></span>
        <span class="dot dot-yellow" id="term-minimize" title="Recuar"></span>
        <span class="dot dot-green" id="term-status-dot"></span>
      </div>
      <div class="term-title" id="term-title">Carregando...</div>
      <div class="term-spacer"></div>
      <span class="term-status-badge" id="term-status-badge">● Offline</span>
    </div>
    <div class="term-content" id="term-content">
      <pre class="term-screen" id="term-screen"></pre>
      <div class="term-input-line">
        <span class="term-prompt">$</span>
        <input type="text" class="term-input" id="term-input" spellcheck="false" autofocus />
      </div>
    </div>
  </div>

  <script>
    // =================== INICIALIZAÇÃO ===================
    const params = new URLSearchParams(window.location.search);
    const serverId = params.get('serverId');
    const serverName = params.get('name') || 'Terminal';
    document.getElementById('term-title').textContent = serverName;

    // =================== CUSTOMIZAÇÕES ===================
    function lp(key, def) {
      const ps = localStorage.getItem(`pref:term-${serverId}-${key}`);
      if (ps !== null) return ps;
      const g = localStorage.getItem(`pref:term-${key}`);
      return g !== null ? g : def;
    }

    const root = document.documentElement;
    const container = document.getElementById('term-container');
    const termLayer = document.getElementById('term-media-layer');
    const termImg = document.getElementById('term-bg-image-el');
    const termVid = document.getElementById('term-bg-video-el');
    const screen = document.getElementById('term-screen');
    const input = document.getElementById('term-input');
    const badge = document.getElementById('term-status-badge');
    let serverConfig = null;
    let serverRunning = false;

    function normalizeCmd(cmd) {
      return (cmd || '').replace(/\s+/g, ' ').trim();
    }

    function setServerStatus(status) {
      serverRunning = status === 'online';
      if (serverRunning) {
        badge.textContent = '● Online';
        badge.className = 'term-status-badge online';
      } else {
        badge.textContent = '● Offline';
        badge.className = 'term-status-badge offline';
      }
    }

    function applyTerminalPrefs() {
      root.style.setProperty('--term-font-family', lp('fontFamily', "'JetBrains Mono', monospace"));
      root.style.setProperty('--term-font-size', lp('fontSize', '13') + 'px');
      root.style.setProperty('--term-color', lp('color', '#3DFF9C'));
      root.style.setProperty('--term-bg-opacity', lp('opacity', '0.95'));
      root.style.setProperty('--term-glow', lp('glow', '0.3'));

      const bgStyle = lp('bgStyle', 'solid');
      container.classList.remove('bg-solid', 'bg-glass', 'bg-acrylic', 'bg-transparent', 'bg-gradient');
      container.classList.add('bg-' + bgStyle);

      const promptEl = document.querySelector('.term-prompt');
      if (promptEl) promptEl.textContent = lp('prompt', '$');
    }

    applyTerminalPrefs();

    // =================== TERMINAL (div-based) ===================
    let buffer = '';

    function stripAnsi(text) {
      return text
        .replace(/\x1b\[[0-9;?]*[ -/]*[@-~]/g, '')
        .replace(/\x1b[@-Z\\-_]/g, '')
        .replace(/\x1b\][^\x07]*(\x07|\x1b\\)/g, '');
    }

    function renderTerminal(text) {
      // Normaliza CRLF/CR e remove sequências ANSI básicas para o renderer textual
      const normalized = stripAnsi(text)
        .replace(/\r\n/g, '\n')
        .replace(/\r/g, '\n');
      screen.textContent = normalized;
      screen.scrollTop = screen.scrollHeight;
    }

    function appendTerminalLine(text) {
      buffer += `${text}\n`;
      renderTerminal(buffer);
    }

    function handleCtrlC(e) {
      if (!(e.ctrlKey || e.metaKey) || e.key.toLowerCase() !== 'c') return false;
      e.preventDefault();
      e.stopPropagation();

      if (serverRunning) {
        appendTerminalLine('^C');
        window.api.stopServer(serverId);
      } else {
        window.api.writeTerminal(serverId, '\u0003');
      }

      input.value = '';
      return true;
    }

    function syncBgMedia() {
      const mirror = localStorage.getItem('pref:bgMirrorTerminals') === 'true';
      const type = localStorage.getItem('pref:bgMediaType');
      const path = localStorage.getItem('pref:bgMediaPath');

      if (!mirror || !type || !path) {
        termLayer.style.display = 'none';
        termImg.src = '';
        termVid.src = '';
        termVid.style.display = 'none';
        return;
      }

      termLayer.style.display = 'block';
      termImg.style.display = 'none';
      termVid.style.display = 'none';

      if (type === 'image') {
        termImg.src = path;
        termImg.style.display = 'block';
      } else {
        termVid.src = path;
        termVid.style.display = 'block';
        termVid.play().catch(() => {});
      }
    }

    // Recebe dados do PTY
    window.api.onTerminalData((data) => {
      buffer += data;
      renderTerminal(buffer);
    });

    window.api.onServerUpdate((updated) => {
      if (updated && updated.id === serverId) {
        setServerStatus(updated.status);
      }
    });

    window.addEventListener('storage', (event) => {
      if (!event.key) return;
      if (
        event.key.startsWith('pref:term-') ||
        event.key === 'pref:bgMediaType' ||
        event.key === 'pref:bgMediaPath' ||
        event.key === 'pref:bgMirrorTerminals'
      ) {
        applyTerminalPrefs();
        syncBgMedia();
      }
    });

    window.api.getServer(serverId).then((srv) => {
      serverConfig = srv;
      if (srv && srv.status) setServerStatus(srv.status);
    });

    // Envia input para o PTY
    input.addEventListener('keydown', (e) => {
      if (handleCtrlC(e)) return;

      if (e.key === 'Enter') {
        const cmd = input.value.trim();
        if (!cmd) return;

        const startCommand = normalizeCmd(serverConfig?.startCommand);
        const typedCommand = normalizeCmd(cmd);

        if (startCommand && typedCommand === startCommand) {
          if (serverRunning) {
            appendTerminalLine(`[ServerRunner] O servidor já está em execução.`);
          } else {
            appendTerminalLine(`$ ${cmd}`);
            window.api.startServer(serverId, { exposeTunnel: false }).catch((err) => {
              appendTerminalLine(`[ServerRunner] ${err.message || 'Falha ao iniciar servidor.'}`);
            });
          }
          input.value = '';
          return;
        }

        window.api.writeTerminal(serverId, cmd + '\n');
        input.value = '';
      }
    });

    document.addEventListener('keydown', (e) => {
      if (document.activeElement === input) return;
      handleCtrlC(e);
    });

    // Status inicial
    window.api.terminalStatus(serverId).then((status) => {
      setServerStatus(status);
    });

    // =================== BOTÕES ===================
    document.getElementById('term-close').addEventListener('click', () => {
      window.api.closeTerminal(serverId);
    });
    document.getElementById('term-minimize').addEventListener('click', () => {
      window.api.closeTerminal(serverId);
    });

    // =================== DRAG ===================
    const tb = document.getElementById('term-titlebar');
    let dr = false, sx, sy;
    tb.addEventListener('mousedown', (e) => {
      if (e.target.closest('.term-dots')) return;
      dr = true; sx = e.clientX; sy = e.clientY;
    });
    document.addEventListener('mousemove', (e) => {
      if (!dr) return;
      window.moveBy(e.clientX - sx, e.clientY - sy);
      sx = e.clientX; sy = e.clientY;
    });
    document.addEventListener('mouseup', () => { dr = false; });

    syncBgMedia();
    input.focus();
  </script>
</body>
</html>
